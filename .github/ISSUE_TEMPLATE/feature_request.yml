name: Feature request
description: Suggest an improvement for 611nft
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and transaction impact
      description: Describe any effect on keys, signing, RPC, Preview, confirmation, or broadcasting.
