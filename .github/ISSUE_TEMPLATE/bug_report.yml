name: Bug report
description: Report a reproducible 611nft problem without sharing credentials
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include private keys, seed phrases, cookies, authenticated RPC URLs, or signed transactions.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using redacted addresses and configuration.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS/Linux, Node.js version, commit
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
